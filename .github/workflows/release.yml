name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          flags="-s -w -X main.version=${GITHUB_REF_NAME}"
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$flags" -o dist/hdup-darwin-arm64 ./cmd/hdup
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$flags" -o dist/hdup-windows-amd64.exe ./cmd/hdup
          cd dist && sha256sum hdup-* > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
